# Application Configuration
spring:
  application:
    name: mcp-hello-world
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: sonnet-5
  main:
    # Disable banner to prevent stdout pollution in stdio mode
    banner-mode: "off"
    # Disable web server by default (stdio mode)
    web-application-type: none

# Server Configuration (only used when mcp.client.demo.enabled=true)
server:
  port: 8080

# Logging Configuration
logging:
  level:
    root: INFO
    com.ai.mcp: DEBUG

# OpenAPI / Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
